name: Scraper de noticias (tesis)

# Recolecta el corpus de noticias cada 3 horas, todos los días.
# Antes era 2x/día, pero los feeds muestran sólo las ~20 notas más recientes y las
# secciones de negocios/energía rotan rápido -> se perdían notas entre lecturas.
# Con el pre-dedup (no re-clasifica links ya guardados), correr seguido no gasta
# Gemini de más. 8 corridas/día (cron en UTC; cada 3 h a partir de las 00:00 UTC).
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña Actions

# Evita que dos corridas se pisen si una se demora
concurrency:
  group: scraper-noticias
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper_noticias.py
